<svg xmlns="http://www.w3.org/2000/svg" width="590" height="236" viewBox="0 0 590 236" role="img" aria-label="One-Shot Person ReID">
<defs>
  <linearGradient id="gTop" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#34343F"/><stop offset=".55" stop-color="#23232C"/><stop offset="1" stop-color="#1A1A21"/>
  </linearGradient>
  <linearGradient id="gTopV" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3A3550"/><stop offset=".6" stop-color="#25232F"/><stop offset="1" stop-color="#1B1A22"/>
  </linearGradient>
  <linearGradient id="gLeft" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#17171D"/><stop offset="1" stop-color="#0E0E12"/>
  </linearGradient>
  <linearGradient id="gRight" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#24242D"/><stop offset=".35" stop-color="#2E2E39"/>
    <stop offset=".42" stop-color="#1D1D25"/><stop offset="1" stop-color="#141419"/>
  </linearGradient>
  <linearGradient id="gRimV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8B6CFF" stop-opacity=".9"/><stop offset="1" stop-color="#8B6CFF" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="1.6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="22"/>
  </filter>
  <linearGradient id="gCard" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#17171E"/><stop offset="1" stop-color="#0B0B0F"/>
  </linearGradient>
  <linearGradient id="gEdge" x1="0" x2="1">
    <stop offset="0" stop-color="#72D7E8" stop-opacity="0"/><stop offset=".5" stop-color="#72D7E8"/><stop offset="1" stop-color="#72D7E8" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
  .kicker { font: 500 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #72D7E8; letter-spacing: .14em; }
  .title { font: 600 25px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #F0EFF7; letter-spacing: -.01em; }
  .body { font: 400 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #A2A0B3; }
  .chip { font: 500 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #F0EFF7; opacity: .85; }
  .arrow { font: 400 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #A2A0B3; }
  .edge { animation: e 7s ease-in-out infinite; }
  @keyframes e { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .float { animation: f 7s ease-in-out infinite; }
  @keyframes f { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .rim { stroke-opacity: .9; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x=".5" y=".5" width="589" height="235" rx="14" fill="url(#gCard)" stroke="#FFFFFF" stroke-opacity=".08"/>
<rect x="40" y="0" width="510" height="1.2" fill="url(#gEdge)" class="edge"/>
<g class="float"><polygon points="436.0,100.0 488.0,130.0 488.0,104.0 436.0,74.0" fill="url(#gLeft)" stroke="#2B2B36" stroke-width="0.8" opacity="1.0"/>
<polygon points="540.0,100.0 488.0,130.0 488.0,104.0 540.0,74.0" fill="url(#gRight)" stroke="#2B2B36" stroke-width="0.8" opacity="1.0"/>
<polygon points="488.0,44.0 540.0,74.0 488.0,104.0 436.0,74.0" fill="url(#gTop)" stroke="#3A3A48" stroke-width="0.8"/>
<path d="M488.0,130.0 L488.0,104.0" stroke="#4A4A5C" stroke-width="0.8"/>
<path d="M436.0,74.0 L488.0,44.0 L540.0,74.0" fill="none" stroke="#8B6CFF" stroke-width="1.4" stroke-linecap="round" filter="url(#glow)" class="rim"/>
<path d="M540.0,74.0 L540.0,96.1" fill="none" stroke="url(#gRimV)" stroke-width="1.2"/><g transform="translate(488.0,74.0)"><ellipse rx="22" ry="12.7" fill="#08080B" stroke="#72D7E8" stroke-opacity=".6" filter="url(#glow)"/><ellipse rx="12" ry="6.9" fill="#1A1630"/><ellipse cx="-4" cy="-2.5" rx="3" ry="1.7" fill="#F0EFF7" opacity=".5"/></g></g>
<text x="28" y="44" class="kicker">COMPUTER VISION  ·  EDGE AI</text>
<text x="28" y="78" class="title">One-Shot Person ReID</text>
<text x="28" y="110" class="body">Enrol a person from one photo, then find them in</text><text x="28" y="132" class="body">live streams. Face-based identity that survives a</text><text x="28" y="154" class="body">change of clothes, with Unknown as a real answer.</text>
<g transform="translate(28,186)"><rect width="56" height="24" rx="12" fill="#0B0B0F" stroke="#2E2E3A"/><text x="28.1" y="16" text-anchor="middle" class="chip">YOLO26</text></g><g transform="translate(92,186)"><rect width="71" height="24" rx="12" fill="#0B0B0F" stroke="#2E2E3A"/><text x="35.3" y="16" text-anchor="middle" class="chip">BoT-SORT</text></g><g transform="translate(171,186)"><rect width="42" height="24" rx="12" fill="#0B0B0F" stroke="#2E2E3A"/><text x="20.9" y="16" text-anchor="middle" class="chip">ONNX</text></g><g transform="translate(221,186)"><rect width="56" height="24" rx="12" fill="#0B0B0F" stroke="#2E2E3A"/><text x="28.1" y="16" text-anchor="middle" class="chip">OpenCV</text></g><g transform="translate(285,186)"><rect width="56" height="24" rx="12" fill="#0B0B0F" stroke="#2E2E3A"/><text x="28.1" y="16" text-anchor="middle" class="chip">Jetson</text></g>
<text x="560" y="46" text-anchor="end" class="arrow">↗</text>
</svg>
